<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>t3d-atmosphere globe sky</title>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link type="text/css" rel="stylesheet" href="main.css">
</head>
<body>
    <div id="info">
        <a href="" target="_blank">t3d-atmosphere</a> - globe sky (WIP)
    </div>

	<!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="./node_modules/es-module-shims/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "t3d": "./node_modules/t3d/build/t3d.module.js",
                "t3d/addons/": "./node_modules/t3d/examples/jsm/",
				"t3d-effect-composer": "./node_modules/t3d-effect-composer/build/t3d.effectcomposer.module.js",
				"t3d-3dtiles": "./node_modules/t3d-3dtiles/build/t3d.3dtiles.module.js",
				"t3d-atmosphere": "../build/t3d.atmosphere.module.js",
				"tweakpane": "./node_modules/tweakpane/dist/tweakpane.js"
            }
        }
    </script>

    <script type="module">
		import * as t3d from 't3d';
		import { DRACOLoader } from 't3d/addons/loaders/DRACOLoader.js';
		import { DefaultEffectComposer, ToneMappingEffect, ToneMappingType } from 't3d-effect-composer';
		import { TilesRenderer, CesiumIonAuthPlugin, ReorientationPlugin, GLTFExtensionsPlugin, GlobeControls } from 't3d-3dtiles';
		import { AtmosLUTsGenerator, AtmosLUTsLoader, AtmosSky, AtmosFogEffect, getAltitudeCorrectionOffset, getSkyLightSH } from 't3d-atmosphere';
		import ionAccessToken from './ionAccessToken.js';
		import { Pane } from 'tweakpane';

		let width = window.innerWidth || 2;
		let height = window.innerHeight || 2;

		const container = document.createElement('div');
		document.body.appendChild(container);

		const canvas = document.createElement('canvas');
		canvas.width = width;
		canvas.height = height;
		container.appendChild(canvas);

		const gl = canvas.getContext('webgl2');
		const renderer = new t3d.WebGLRenderer(gl);
		renderer.setClearColor(0, 0, 0, 0);

		const backRenderTarget = new t3d.RenderTargetBack(canvas);

		const effectComposer = new DefaultEffectComposer(width, height, {
			samplerNumber: Math.min(renderer.capabilities.maxSamples, 5),
			webgl2: renderer.capabilities.version > 1,
			highDynamicRange: true
		});
		effectComposer.sceneMSAA = true;
		effectComposer.getBuffer('GBuffer').supportLogDepth = true;

		const atmosFogEffect = new AtmosFogEffect();
		effectComposer.addEffect('AtmosFog', atmosFogEffect, 1);

		const toneMappingEffect = new ToneMappingEffect();
		toneMappingEffect.toneMapping = ToneMappingType.AgX;
		toneMappingEffect.toneMappingExposure = 3.0;
		effectComposer.addEffect('ToneMapping', toneMappingEffect, 2);

		const scene = new t3d.Scene();
		scene.logarithmicDepthBuffer = true;

		const camera = new t3d.Camera();
		camera.setPerspective(60 / 180 * Math.PI, width / height, 1, 160000000);
		camera.position.set(0, 0, -15000000);
		camera.lookAt(new t3d.Vector3(0, 0, 0), new t3d.Vector3(0, 1, 0));
		scene.add(camera);

		const controller = new GlobeControls(scene, camera, canvas);
		controller.enableDamping = true;

		// scene

		const tiles = new TilesRenderer();
		tiles.registerPlugin(new CesiumIonAuthPlugin({
			apiToken: ionAccessToken,
			assetId: '2275207',
			autoRefreshToken: true
		}));
		tiles.registerPlugin(new ReorientationPlugin());
		tiles.registerPlugin(new GLTFExtensionsPlugin({
			dracoLoader: new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.3/')
		}));

		tiles.addCamera(camera);
		tiles.setResolution(width, height);
		scene.add(tiles.group);

		controller.setEllipsoid(tiles.ellipsoid, tiles.group);

		// luts

		const precomputeOptions = {
			source: 'loader',
			transmittanceMapping: 2
		};

		let atmosLUTsGenerator, atmosLUTsLoader, atmosLUTsData;

		async function getLUTsData() {
			atmosLUTsData = null;

			if (atmosLUTsGenerator) {
				atmosLUTsGenerator.dispose();
			}

			if (precomputeOptions.source === 'generator') {
				atmosLUTsGenerator = new AtmosLUTsGenerator(renderer.capabilities, precomputeOptions);

				console.time('compute transmittance');
				atmosLUTsGenerator.computeTransmittance(renderer);
				console.timeEnd('compute transmittance');

				console.time('compute inscatter');
				atmosLUTsGenerator.computeInscatter(renderer);
				console.timeEnd('compute inscatter');

				console.time('compute irradiance');
				atmosLUTsGenerator.computeIrradiance(renderer);
				console.timeEnd('compute irradiance');

				// get transmittance pixels for sun light color calculation
				console.time('read transmittance pixels');
				const transmittanceRT = atmosLUTsGenerator._transmittanceRT;
				const { width, height } = transmittanceRT;
				const data = transmittanceRT.texture.type === t3d.PIXEL_TYPE.FLOAT ?
					new Float32Array(width * height * 4) :
					new Uint16Array(width * height * 4);
				renderer.setRenderTarget(transmittanceRT);
				renderer.readRenderTargetPixels(
					0, 0, width, height,
					data
				);
				transmittanceRT.texture.image.data = data;
				console.timeEnd('read transmittance pixels');

				atmosLUTsGenerator.readIrradiancePixels(renderer);

				atmosLUTsData = atmosLUTsGenerator.data;
			} else {
				if (!atmosLUTsLoader) {
					atmosLUTsLoader = new AtmosLUTsLoader(renderer.capabilities);

					console.time('load transmittance');
					await atmosLUTsLoader.loadTransmittanceTexture('./assets/transmittance.bin');
					console.timeEnd('load transmittance');

					console.time('load inscatter');
					await atmosLUTsLoader.loadInscatterTexture('./assets/scattering.bin');
					console.timeEnd('load inscatter');

					console.time('load irradiance');
					await atmosLUTsLoader.loadIrradianceTexture('./assets/irradiance.bin');
					console.timeEnd('load irradiance');
				}

				atmosLUTsData = atmosLUTsLoader.data;
			}

			return atmosLUTsData;
		}

		// sky and sun

		const sky = new AtmosSky();
		scene.add(sky);

		const skyMaterial = sky.material;
		skyMaterial.defines.TONE_MAPPING = -1;
		skyMaterial.defines.SRGB_OUTPUT = false;
		skyMaterial.defines.GROUND_ALBEDO = false;
		skyMaterial.uniforms.toneMappingExposure = 1.0;

		const skyLight = new t3d.SphericalHarmonicsLight();
		scene.add(skyLight);

		const directionalLight = new t3d.DirectionalLight(0xffffff, 1.8);
		directionalLight.position.set(-10, 20, 30);
		directionalLight.castShadow = true;
		directionalLight.shadow.windowSize = 3;
		scene.add(directionalLight);

		const sunAngles = { x: -23, y: 17 };
		const spherical = new t3d.Spherical(50, 0, 0);
		const vector3 = new t3d.Vector3();

		function setSunLightDirection() {
			spherical.phi = Math.PI / 2 - sunAngles.y * Math.PI / 180;
			spherical.theta = Math.PI - sunAngles.x * Math.PI / 180;
			vector3.setFromSpherical(spherical);

			directionalLight.position.copy(vector3);
			directionalLight.lookAt(new t3d.Vector3(), new t3d.Vector3(0, 1, 0));

			vector3.normalize();
			vector3.toArray(skyMaterial.uniforms.sunDirection);
		}

		function setSunLightColor() {}

		getLUTsData().then(lutsData => {
			sky.setLUTs(lutsData);
			atmosFogEffect.setLUTs(lutsData);
			setSunLightDirection();
		});

		// gui

		const pane = new Pane();

		const lutsFolder = pane.addFolder({
			title: 'LUTs',
			expanded: false
		});
		lutsFolder.addBinding(precomputeOptions, 'source', {
			label: 'Source',
			options: {
				'Generator': 'generator',
				'Loader': 'loader'
			}
		}).on('change', async ({ value }) => {
			pane.disabled = true;

			const lutsData = await getLUTsData();
			sky.setLUTs(lutsData);
			atmosFogEffect.setLUTs(lutsData);
		
			pane.disabled = false;
			precomputeFolder.disabled = value === 'loader';
		});
		const precomputeFolder = lutsFolder.addFolder({
			title: 'Generator Options'
		}).on('change', async () => {
			const lutsData = await getLUTsData();
			sky.setLUTs(lutsData);
			atmosFogEffect.setLUTs(lutsData);
		});
		precomputeFolder.addBinding(precomputeOptions, 'transmittanceMapping', {
			label: 'Transmittance Mapping',
			options: {
				'Linear': 0,
				'Mapping-2008': 1,
				'Mapping-2017': 2
			}
		});

		const groundFolder = pane.addFolder({
			title: 'Ground',
			expanded: false
		});
		groundFolder.addBinding(skyMaterial.defines, 'GROUND_ALBEDO', {
			label: 'sky ground albedo'
		}).on('change', () => {
			skyMaterial.needsUpdate = true;
		});
		groundFolder.addBinding(tiles.group, 'visible', {
			label: 'Show Earth'
		});

		const sunFolder = pane.addFolder({
			title: 'Sun'
		});
		sunFolder.addBinding({ sunAngles }, 'sunAngles', {
			x: { min: -180, max: 180 },
			y: { min: -90, max: 90, inverted: true },
			label: 'Angles',
			expanded: true,
			picker: 'inline'
		}).on('change', () => {
			setSunLightDirection();
			setSunLightColor();
		});
		sunFolder.addBinding(skyMaterial.defines, 'SKY_SUNDISK', {
			label: 'Disk'
		}).on('change', () => {
			skyMaterial.needsUpdate = true;
		});
		sunFolder.addBinding(skyMaterial.uniforms, 'sunDiskSize', {
			min: 0,
			label: 'Disk Size'
		});

		const skyLightFolder = pane.addFolder({
			title: 'Sky Light',
			expanded: false
		});
		skyLightFolder.addBinding(skyLight, 'visible', {
			label: 'Enable'
		});

		const fogFolder = pane.addFolder({
			title: 'Fog Effect',
			expanded: false
		});
		fogFolder.addBinding(atmosFogEffect, 'active', {
			label: 'Enable'
		});
		fogFolder.addBinding(atmosFogEffect._mainPass.material.defines, 'SUN_LIGHT').on('change', () => {
			atmosFogEffect._mainPass.material.needsUpdate = true;
		});
		fogFolder.addBinding(atmosFogEffect._mainPass.material.defines, 'SKY_LIGHT').on('change', () => {
			atmosFogEffect._mainPass.material.needsUpdate = true;
		});

		const toneMappingFolder = pane.addFolder({
			title: 'Tone Mapping',
			expanded: false
		});
		toneMappingFolder.addBinding(toneMappingEffect, 'toneMapping', {
			label: 'Tone Mapping',
			options: ToneMappingType
		});
		toneMappingFolder.addBinding(toneMappingEffect, 'toneMappingExposure', {
			min: 0,
			step: 1,
			label: 'Exposure'
		});

		const otherFolder = pane.addFolder({
			title: 'Other',
			expanded: false
		});
		otherFolder.addBinding(skyMaterial, 'dithering', {
			label: 'Dithering'
		}).on('change', () => {
			skyMaterial.needsUpdate = true;
		});

		//

		const _cameraPosition = new t3d.Vector3();
		const _sunDirection = new t3d.Vector3();
		const _altitudeCorrection = new t3d.Vector3();
		const _projectedScale = new t3d.Vector3();
		const _geodetic = {};

		function loop(count) {
			requestAnimationFrame(loop);

			controller.update();

			camera.updateMatrix();

			scene.anchorMatrix.copy(camera.worldMatrix);
		
			tiles.update();

			// Get camera positlion, altitudeCorrection and sun direction
		
			_cameraPosition.copy(camera.position);
			getAltitudeCorrectionOffset(_cameraPosition, 6360000, tiles.ellipsoid, _altitudeCorrection);
			_sunDirection.fromArray(skyMaterial.uniforms.sunDirection);

			// Set Sky Material Uniforms
		
			_cameraPosition.toArray(skyMaterial.uniforms.cameraPosition);
			_altitudeCorrection.toArray(skyMaterial.uniforms.altitudeCorrection);

			// Set Atmos Fog Effect Uniforms

			_cameraPosition.toArray(atmosFogEffect._mainPass.material.uniforms.cameraPosition);
			_sunDirection.toArray(atmosFogEffect._mainPass.material.uniforms.sunDirection);
			_altitudeCorrection.toArray(atmosFogEffect._mainPass.material.uniforms.altitudeCorrection);
			tiles.ellipsoid.radius.toArray(atmosFogEffect._mainPass.material.uniforms.ellipsoidRadii);

			const cameraHeight = tiles.ellipsoid.getPositionToCartographic(_cameraPosition, _geodetic).height;
			const projectedScale = _projectedScale.set(0, Math.max(...tiles.ellipsoid.radius), -Math.max(0.0, cameraHeight))
				.applyMatrix4(camera.projectionMatrix);
			const geometricErrorCorrectionAmount = t3d.MathUtils.mapLinear(projectedScale.y, 41.5, 13.8, 0, 1);
			atmosFogEffect._mainPass.material.uniforms.geometricErrorCorrectionAmount = t3d.MathUtils.clamp(geometricErrorCorrectionAmount, 0, 1);
		
			// Set Sky Light SH

			if (skyLight.visible && atmosLUTsData) {
				_cameraPosition.add(_altitudeCorrection);
				_cameraPosition.normalize().multiplyScalar(6360000 + 1);
				getSkyLightSH(atmosLUTsData.irradianceTexture, _cameraPosition, _sunDirection, skyLight.sh, tiles.ellipsoid);
			}

			scene.updateMatrix();
			scene.updateRenderStates(camera);
			scene.updateRenderQueue(camera);

			effectComposer.render(renderer, scene, camera, backRenderTarget);
		}
		requestAnimationFrame(loop);

		function onWindowResize() {
			width = window.innerWidth || 2;
			height = window.innerHeight || 2;

			camera.setPerspective(60 / 180 * Math.PI, width / height, 1, 160000000);

			backRenderTarget.resize(width, height);
    		effectComposer.resize(width, height);
		}
		window.addEventListener('resize', onWindowResize, false);
	</script>
</body>
</html>
